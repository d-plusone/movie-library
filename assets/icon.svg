<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1C2C4E"/>
      <stop offset="0.48" stop-color="#0C1425"/>
      <stop offset="1" stop-color="#04060B"/>
    </linearGradient>
    <radialGradient id="spotlight" cx="0.5" cy="0.4" r="0.62">
      <stop offset="0" stop-color="#2F6BFF" stop-opacity="0.55"/>
      <stop offset="0.5" stop-color="#1D4ED8" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#1D4ED8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="playGradient" x1="0.18" y1="0.06" x2="0.82" y2="0.94">
      <stop offset="0" stop-color="#B7F1FF"/>
      <stop offset="0.32" stop-color="#59D5FF"/>
      <stop offset="0.7" stop-color="#2F8BFF"/>
      <stop offset="1" stop-color="#1E50E0"/>
    </linearGradient>
    <linearGradient id="reelGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A5D8FF" stop-opacity="0.75"/>
      <stop offset="0.5" stop-color="#3B82F6" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#1E3A8A" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="sheenGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.02"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="28"/>
    </filter>
    <filter id="dropShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
    <clipPath id="squircleClip">
      <rect x="100" y="100" width="824" height="824" rx="185"/>
    </clipPath>
    <mask id="reelMask">
      <circle cx="512" cy="512" r="330" fill="none" stroke="#FFFFFF" stroke-width="94"/>
      <circle cx="512" cy="512" r="330" fill="none" stroke="#000000" stroke-width="46" stroke-dasharray="30 100"/>
    </mask>
  </defs>

  <rect x="100" y="112" width="824" height="824" rx="185" fill="#000000" opacity="0.36" filter="url(#iconShadow)"/>

  <g clip-path="url(#squircleClip)">
  <rect width="1024" height="1024" fill="url(#background)"/>
  <rect width="1024" height="1024" fill="url(#spotlight)"/>
  <path d="M-180 720 L720 -180 L1010 110 L110 1010 Z" fill="url(#sheenGradient)"/>

  <g>
    <circle cx="512" cy="512" r="330" fill="none" stroke="url(#reelGradient)" stroke-width="94" mask="url(#reelMask)"/>
    <circle cx="512" cy="512" r="378" fill="none" stroke="#9BD7FF" stroke-opacity="0.10" stroke-width="3"/>
    <circle cx="512" cy="512" r="282" fill="none" stroke="#9BD7FF" stroke-opacity="0.10" stroke-width="3"/>
  </g>

  <path d="M430 338 L714 512 L430 686 Z" fill="#22D3EE" opacity="0.32" filter="url(#softGlow)"/>
  <path d="M446 362 L712 526 L446 702 Z" fill="#000000" opacity="0.38" filter="url(#dropShadow)"/>
  <path d="M 462 344 Q 430 326 430 372 L 430 652 Q 430 698 462 680 L 702 528 Q 736 512 702 496 Z" fill="url(#playGradient)"/>
  <path d="M 462 344 Q 430 326 430 372 L 430 490" fill="none" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="7" stroke-linecap="round"/>
  </g>

  <rect x="100.75" y="100.75" width="822.5" height="822.5" rx="185" fill="none" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="1.5"/>
</svg>
