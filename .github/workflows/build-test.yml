name: Build Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # lint / type-check を高速に検証するジョブ（フルビルドより先に失敗させる）
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v5

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm run prisma:generate

      - name: Lint
        run: pnpm run lint:check

      - name: Type check
        run: pnpm run type-check

      - name: Test
        run: pnpm test

  test-build:
    needs: quality
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    strategy:
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v5

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify ffmpeg binary (macOS)
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          # @ffmpeg-installer/darwin-arm64 は optionalDependencies のため
          # macOS (arm64) ランナーでは pnpm install が自動インストールする
          if [ -f "node_modules/@ffmpeg-installer/darwin-arm64/ffmpeg" ]; then
            echo "✅ @ffmpeg-installer/darwin-arm64/ffmpeg ready"
          else
            echo "❌ darwin-arm64 ffmpeg not found（macOS ランナーが arm64 でない可能性）"
            exit 1
          fi

      - name: Verify ffmpeg binary (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          # @ffmpeg-installer/win32-x64 は optionalDependencies のため
          # Windows ランナーでは pnpm install が自動インストールする
          # ※ npm install を混在させると pnpm の node_modules 構造でクラッシュするため使わない
          if [ -f "node_modules/@ffmpeg-installer/win32-x64/ffmpeg.exe" ]; then
            echo "✅ @ffmpeg-installer/win32-x64/ffmpeg.exe ready"
          else
            echo "❌ ffmpeg.exe not found - build may fail"
            exit 1
          fi

      - name: Install electron-rebuild
        run: pnpm install -g @electron/rebuild@3.6.0

      - name: Rebuild native modules with electron-rebuild (macOS)
        if: matrix.os == 'macos-latest'
        run: electron-rebuild

      - name: Rebuild native modules with electron-rebuild (Windows)
        if: matrix.os == 'windows-latest'
        env:
          npm_config_target_arch: x64
          npm_config_target_platform: win32
        run: electron-rebuild

      - name: Test build (macOS)
        if: matrix.os == 'macos-latest'
        env:
          # アドホック署名: package.json の identity: "-" が使われる
          DEBUG: electron-builder
        run: pnpm run build:optimized

      - name: Test build (Windows)
        if: matrix.os == 'windows-latest'
        run: pnpm run build:win
