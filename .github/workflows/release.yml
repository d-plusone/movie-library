name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # リリース前に lint / type-check を高速に検証するジョブ
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out Git repository
        uses: actions/checkout@v5

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm run prisma:generate

      - name: Lint
        run: pnpm run lint:check

      - name: Type check
        run: pnpm run type-check

  release:
    needs: quality
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    strategy:
      matrix:
        os: [macos-latest, windows-latest]

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v5

      - name: Extract version from tag
        id: get_version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Update package.json version
        run: pnpm version ${{ steps.get_version.outputs.VERSION }} --no-git-tag-version

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify ffmpeg binary (macOS)
        if: matrix.os == 'macos-latest'
        shell: bash
        run: |
          # @ffmpeg-installer/darwin-arm64 は optionalDependencies のため
          # macOS (arm64) ランナーでは pnpm install が自動インストールする
          if [ -f "node_modules/@ffmpeg-installer/darwin-arm64/ffmpeg" ]; then
            echo "✅ @ffmpeg-installer/darwin-arm64/ffmpeg ready"
          else
            echo "❌ darwin-arm64 ffmpeg not found（macOS ランナーが arm64 でない可能性）"
            exit 1
          fi

      - name: Verify ffmpeg binary (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          # @ffmpeg-installer/win32-x64 は optionalDependencies のため
          # Windows ランナーでは pnpm install が自動インストールする
          # ※ npm install を混在させると pnpm の node_modules 構造でクラッシュするため使わない
          if [ -f "node_modules/@ffmpeg-installer/win32-x64/ffmpeg.exe" ]; then
            echo "✅ @ffmpeg-installer/win32-x64/ffmpeg.exe ready"
          else
            echo "❌ ffmpeg.exe not found - build may fail"
            exit 1
          fi

      - name: Install electron-rebuild
        run: pnpm install -g @electron/rebuild@3.6.0

      - name: Rebuild native modules with electron-rebuild (macOS)
        if: matrix.os == 'macos-latest'
        run: electron-rebuild

      - name: Rebuild native modules with electron-rebuild (Windows)
        if: matrix.os == 'windows-latest'
        env:
          npm_config_target_arch: x64
          npm_config_target_platform: win32
        run: electron-rebuild

      - name: Verify version before build
        shell: bash
        run: |
          echo "Building version: $(node -p "require('./package.json').version")"
          echo "Git tag: ${{ github.ref }}"
          echo "Extracted version: ${{ steps.get_version.outputs.VERSION }}"

      - name: Build/release Electron app (macOS)
        if: matrix.os == 'macos-latest'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # アドホック署名（"-"）: Apple Developer証明書不要でGatekeeperをパス可能にする
          # 本格リリース時は以下を有効化:
          # CSC_LINK: ${{ secrets.CSC_LINK }}
          # CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          DEBUG: electron-builder
        run: |
          # package.json の mac.target は arm64 専用（ユニバーサルではない）
          # build:optimized:publish は prisma:generate + build:ts を内包
          pnpm run build:optimized:publish

          # ビルド結果の確認
          echo "Build results:"
          ls -la dist/

          # DMGファイルの確認
          for dmg in dist/*.dmg; do
            if [ -f "$dmg" ]; then
              echo "Generated DMG: $(basename "$dmg")"
              echo "Size: $(ls -lh "$dmg" | awk '{print $5}')"
            fi
          done

      - name: Build/release Electron app (Windows)
        if: matrix.os == 'windows-latest'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm run build:win:publish
